name: Backend tests

# So a status check is visible on every commit/PR, not just claimed in a
# commit message - see Review.md's note that there was no way to verify the
# "87 tests green" claim from the commit itself. The test suite is fully
# self-contained (backend/tests/setup.js sets every env var it needs, and
# globalSetup.js builds its own throwaway test.db), so this needs no secrets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
